[project]
name = "python-notebook-env"
version = "0.1.0"
description = "Shared reproducible Python environment for Jupyter notebooks"
requires-python = "==3.12.*"
dependencies = [
    "ipykernel==6.30.1",
    "jupyterlab==4.4.7",
    "numpy==2.3.3",
    "pandas==2.3.2",
    "matplotlib==3.10.6",
    "seaborn==0.13.2",
    "scipy==1.16.2",
    "scikit-learn==1.7.2",
    "joblib==1.5.2",
    "openpyxl==3.1.5",
]

[tool.uv]
package = false
